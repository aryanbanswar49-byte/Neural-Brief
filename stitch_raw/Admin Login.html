<body class="min-h-screen flex items-center justify-center p-unit-md text-on-surface">
<main class="w-full max-w-[400px]">
<!-- Brand Logo -->
<div class="text-center mb-unit-xl">
<h1 class="font-display-lg text-display-lg-mobile md:text-display-lg text-on-background">The Editorial</h1>
</div>
<!-- Login Card -->
<div class="bg-surface-container-lowest border border-outline-variant rounded-lg p-unit-xl">
<h2 class="font-headline-sm text-headline-sm text-center mb-unit-lg">Admin Login</h2>
<form class="space-y-unit-md">
<!-- Email Field -->
<div>
<label class="block font-ui-label text-ui-label text-on-surface-variant mb-unit-sm" for="email">Email address</label>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all font-body-md text-body-md text-on-surface placeholder:text-outline" id="email" name="email" placeholder="admin@theeditorial.com" required="" type="email"/>
</div>
<!-- Password Field -->
<div>
<div class="flex justify-between items-center mb-unit-sm">
<label class="block font-ui-label text-ui-label text-on-surface-variant" for="password">Password</label>
<a class="font-ui-label text-ui-label text-primary hover:text-primary-container transition-colors" href="#">Forgot password?</a>
</div>
<input class="w-full px-4 py-3 bg-surface-container-lowest border border-outline-variant rounded focus:border-primary-container focus:ring-2 focus:ring-primary-container/20 transition-all font-body-md text-body-md text-on-surface" id="password" name="password" placeholder="••••••••" required="" type="password"/>
</div>
<!-- Submit Button -->
<button class="w-full py-3 px-6 mt-unit-lg bg-primary-container text-on-primary font-ui-label text-ui-label rounded hover:bg-primary transition-colors focus:outline-none focus:ring-2 focus:ring-primary-container/50" type="submit">
                    Log In
                </button>
</form>
</div>
<!-- Minimal Footer -->
<div class="text-center mt-unit-lg">
<p class="font-caption text-caption text-on-surface-variant">Secure administrative access only.</p>
</div>
</main>
